<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heading</title>
    <body>
       <div class="container">
          <!--Main heading -->         
    <h1>🌤️ My Weather App</h1>
     <!-- weather card -->
    <div class="weather-card">
        <h2>Today's Weather</h2>
        <div class="location">
            📍Gaya,Bihar
        </div>
         <!-- Animated Icon -->
        <div class="weather-icon">
            ☀️
        </div>
        <div class="temperature">
           28<sup>°C</sup>
        </div>
        <div class="condition">
            Sunny and Clear
        </div>
         <!-- Weather Information -->
        <div class="info">
            <div class="info-box">
                💧Humidity:65%
            </div>
            <div class="info-box">
                💨Wind:12km/h
            </div>
            <div class="info-box">
                🌡️Feel Like:30<sup>°C</sup>
            </div>
        <div>
    </div>
       </div>
    <!--weekly forecast-->
    <div>
        <h2>📅 Weekly Forecast</h2>
        <div class="forecast-container">
            
                <div class="day">
                    <h3>Mon</h3>
                    <div class="icon">☀️</div>
                    <div class="temp">29°C</div>
                </div>
                
                <div class="day">
                    <h3>Tue</h3>
                    <div class="icon">🌤️</div>
                    <div class="temp">30°C</div>
                </div>
                <div class="day">
                    <h3>Wed</h3>
                    <div class="icon">🌧️</div>
                    <div class="temp">26°C</div>
                </div>
                <div class="day">
                    <h3>Thu</h3>
                    <div class="icon">⛈️</div>
                    <div class="temp">26°C</div>
                </div>
                 <div class="day">
                    <h3>Fri</h3>
                    <div class="icon">☀️</div>
                    <div class="temp">26°C</div>
                </div>
                 <div class="day">
                    <h3>Sat</h3>
                    <div class="icon">🌤️</div>
                    <div class="temp">26°C</div>
                </div>
 <div class="day">
                    <h3>Sun</h3>
                    <div class="icon">🌧️</div>
                    <div class="temp">26°C</div>
                </div>
        </div>
    </div>
    <!--Foooter-->
    <footer>
        <p>© 2026 My Weather App | Made with HTML & CSS</p>
    </footer>
    <link rel="stylesheet" href="A4_ACP.css">
</body>
</html>
